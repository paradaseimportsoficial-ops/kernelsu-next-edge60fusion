name: Build KernelSU Next do Zero para Moto Edge 60 Fusion

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e repositório Android Kernel (GKI 6.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bison libssl-dev libelf-dev python3-pip lz4 pigz
          pip3 install gdown
          mkdir -p android-kernel
          cd android-kernel
          # Alterado para a branch common-android14-6.1 compatível com o Edge 60 Fusion
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrar KernelSU Next no código-fonte
        run: |
          cd android-kernel/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel do Zero (GKI 6.1)
        run: |
          cd android-kernel
          # Remove o sufixo -dirty do Git
          touch common/.scmversion
          
          # Compila com a assinatura personalizada do Técnico Root V1 na base 6.1
          BUILD_CONFIG=common/build.config.gki.aarch64 LOCALVERSION=-tecnico-root-v1 ./build/build.sh

      - name: Processar e Reempacotar com Magiskboot
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img original do Google Drive (Edge 60 Fusion)
          gdown "https://drive.google.com/uc?id=1LbVjSy8xJotmJxsjI-RAIG79IgIWmP8O" -O boot_stock.img

          # 2. Extrair magiskboot do APK do Magisk
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar o boot.img estoque para inspecionar o formato do kernel
          ./magiskboot unpack boot_stock.img

          # 4. Localizar a imagem criada pela compilação
          COMPILED_IMAGE=$(find ../android-kernel/out -name "Image" -type f | head -n 1)
          echo "Kernel compilado encontrado em: $COMPILED_IMAGE"

          # 5. Identificar o formato do kernel original e comprimir adequadamente
          KERNEL_FMT=$(file kernel | grep -o -E 'LZ4|gzip|raw' || echo "raw")
          echo "Formato detectado do kernel original: $KERNEL_FMT"

          if [[ "$KERNEL_FMT" == *"LZ4"* ]]; then
             lz4 -c -12 "$COMPILED_IMAGE" > kernel
          elif [[ "$KERNEL_FMT" == *"gzip"* ]]; then
             gzip -c -9 "$COMPILED_IMAGE" > kernel
          else
             cp "$COMPILED_IMAGE" kernel
          fi

          # 6. Reempacotar o boot.img final na raiz e na pasta work
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato (boot.img Final Compilado)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Moto_Edge_60_Fusion_Compiled
          path: boot_finished.img
          
